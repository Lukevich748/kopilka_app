<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Копилка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐷</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandTileGrad" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                <stop offset="0%" style="stop-color:var(--accent-a)" />
                <stop offset="55%" style="stop-color:var(--accent-b)" />
                <stop offset="100%" style="stop-color:var(--accent-c)" />
              </linearGradient>
              <linearGradient id="brandCoinGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffe9a8" />
                <stop offset="100%" stop-color="#f3ab2c" />
              </linearGradient>
            </defs>

            <rect x="1.5" y="1.5" width="45" height="45" rx="14" fill="url(#brandTileGrad)" />

            <g transform="rotate(-16 19 10)">
              <ellipse cx="19" cy="10" rx="4.3" ry="5" fill="url(#brandCoinGrad)" />
              <path d="M19 6.6v6.8M17.1 8.3c.2-.9 1-1.3 1.9-1.3s1.7.5 1.7 1.2c0 1.6-3.6 1-3.6 2.6 0 .7.8 1.2 1.7 1.2s1.7-.4 1.9-1.3" stroke="#b8710f" stroke-width=".55" fill="none" stroke-linecap="round" />
            </g>

            <path d="M7.4 25.2c-1.8.2-2.9 1.7-2.2 3.1.5 1.1 2 1.3 2.9.4" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" />

            <ellipse cx="20" cy="30" rx="13" ry="9.5" fill="#fff" />
            <circle cx="35" cy="27" r="7.6" fill="#fff" />

            <path d="M30.8 21.8c-1.6-3.4-.2-6.4 2.6-6.6 2-.1 3 1.7 2 3.8-1 2.2-2.8 4-4.6 2.8Z" fill="#fff" />

            <rect x="9" y="36" width="3.6" height="6.2" rx="1.6" fill="#fff" />
            <rect x="17" y="37.4" width="3.6" height="6.2" rx="1.6" fill="#fff" />
            <rect x="26" y="37.4" width="3.6" height="6.2" rx="1.6" fill="#fff" />
            <rect x="33.4" y="35" width="3.4" height="6.2" rx="1.6" fill="#fff" />

            <rect x="15" y="20.5" width="8" height="2.3" rx="1.15" fill="var(--bg)" />
            <circle cx="33.5" cy="24" r="1.3" fill="var(--bg)" />
            <ellipse cx="40.5" cy="26" rx="0.9" ry="1.3" fill="var(--bg)" opacity="0.65" />
            <ellipse cx="41.6" cy="28.3" rx="0.9" ry="1.3" fill="var(--bg)" opacity="0.65" />
          </svg>
        </span>
        <div>
          <h1>Копилка</h1>
          <p class="brand-sub">Мультивалютные накопления</p>
        </div>
      </div>

      <label class="base-currency-picker">
        <span>Итого в</span>
        <select id="baseCurrencySelect"></select>
      </label>
    </header>

    <section class="summary-card glass" id="summaryCard">
      <div class="summary-left">
        <div class="summary-main">
          <span class="summary-label">Всего накоплено</span>
          <div class="summary-amount" id="grandTotal">
            <span class="amount-value">0</span>
            <span class="amount-currency" id="grandTotalCurrency">USD</span>
            <button type="button" class="visibility-toggle" id="visibilityToggle" title="Скрыть суммы" aria-label="Скрыть суммы" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.29 20.29 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.29 20.29 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="summary-hint" id="txCountHint">Пока нет ни одного пополнения</span>
        </div>
        <div class="summary-chips" id="currencyChips"></div>
      </div>

      <aside class="rates-panel">
        <div class="rates-panel-header">
          <h3>Курсы валют</h3>
          <button type="button" class="rates-refresh" id="ratesRefreshBtn" title="Обновить курсы" aria-label="Обновить курсы">↻</button>
        </div>
        <div class="rates-list" id="ratesList"></div>
        <span class="rates-updated" id="ratesUpdated">Загрузка курсов…</span>
      </aside>
    </section>

    <main class="content-grid">
      <section class="card glass form-card">
        <h2 class="card-title" id="formTitle">Добавить накопление</h2>
        <form id="addForm" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="amountInput">Сумма</label>
              <input id="amountInput" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" required />
            </div>
            <div class="field field-currency">
              <label for="currencySelect">Валюта</label>
              <select id="currencySelect" name="currency"></select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="dateInput">Дата</label>
              <input id="dateInput" name="date" type="date" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-btn">
              <span class="coin" aria-hidden="true">🪙</span>
              <span id="submitBtnLabel">Положить в копилку</span>
            </button>
            <button type="button" class="cancel-edit-btn" id="cancelEditBtn" hidden>Отмена</button>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
        </form>
      </section>

      <section class="card glass history-card">
        <div class="history-header">
          <h2 class="card-title">История пополнений</h2>
          <span class="history-count" id="historyCount"></span>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">🐖</div>
            <p>Пока пусто.<br />Добавьте первое накопление слева.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Данные хранятся локально на этом компьютере</span>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
